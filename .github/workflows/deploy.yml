name: Deploy redirects to blog.pnlapp.co

# The blog now lives at pnlapp.co/blog (built and deployed from the pnlapp
# Website repo). This workflow no longer publishes the full site here — it
# builds normally just to get the real route list, then generates a static
# redirect stub for every route, forwarding blog.pnlapp.co/<path> to
# pnlapp.co/blog/<path>. This keeps existing backlinks and search rankings
# pointed somewhere useful instead of a dead domain.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege by default; the deploy job elevates only what it needs.
permissions:
  contents: read

# Only one deployment at a time. Queue new runs instead of canceling an
# in-progress deploy, so Pages never ends up serving a half-updated build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_NEWSLETTER_ENDPOINT: ${{ secrets.NEWSLETTER_ENDPOINT }}

      - name: Generate redirect stubs
        run: node scripts/gen-redirect-stubs.mjs

      - name: Carry over CNAME
        run: cp public/CNAME dist-redirects/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-redirects

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
